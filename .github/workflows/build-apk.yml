name: Собрать APK «Книжная полка»

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Проверить проект
        run: python3 check_project.py

      - name: Собрать APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Knizhnaya-Polka-install-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
