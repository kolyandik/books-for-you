<title>Книжная полка 1.1 · Ульяновск</title>
<style>
:root{--ink:#202b28;--muted:#78837d;--paper:#f8f6f1;--card:#fffefa;--sage:#e7eee6;--green:#286b55;--green2:#36745e;--border:#e6e9e3;--gold:#d69d60;--red:#ad4a41;--shadow:0 11px 35px rgba(37,61,47,.055)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--paper);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.55;cursor:wait}#app{max-width:530px;min-height:100dvh;margin:0 auto;padding:0 18px calc(92px + env(safe-area-inset-bottom));background:var(--paper)}.top{display:flex;align-items:center;justify-content:space-between;padding:21px 0 18px}.brand{display:flex;gap:11px;align-items:center}.brand-icon{display:grid;place-items:center;background:#255f4b;color:#fff;width:43px;height:43px;border-radius:14px;box-shadow:0 4px 13px #1b634a24;font-size:24px}.brand h1{font-size:18px;margin:0;font-family:Georgia,serif;letter-spacing:-.35px;font-weight:700}.brand small{font-size:10px;color:var(--muted);letter-spacing:1.3px;font-weight:700;text-transform:uppercase}.circle{height:40px;width:40px;display:grid;place-items:center;background:#e9ece6;border:none;border-radius:100%;font-size:20px;color:#315b47}
.hero{background:#dce9df;position:relative;border-radius:24px;overflow:hidden;padding:23px 23px 20px;margin:4px 0 20px;min-height:182px}.hero:before{content:'✦';position:absolute;right:15px;top:-35px;font-size:160px;color:#eaf4ed77;transform:rotate(28deg)}.hero:after{content:'📚';position:absolute;font-size:86px;right:-13px;bottom:-28px;transform:rotate(-17deg);filter:drop-shadow(0 10px 8px #1b534b22)}.eyebrow{color:#36715a;text-transform:uppercase;letter-spacing:1.5px;font-size:10px;font-weight:900}.hero h2{font-size:27px;max-width:265px;line-height:1.12;font-family:Georgia,'Times New Roman',serif;letter-spacing:-.7px;position:relative;z-index:1;margin:12px 0}.hero p{font-size:12px;line-height:1.45;max-width:225px;color:#3f6150;position:relative;z-index:1;margin-bottom:0}.search-box{background:white;border:1px solid var(--border);padding:7px;border-radius:17px;box-shadow:var(--shadow);display:flex;gap:4px;align-items:center}.search-box input{min-width:0;flex:1;padding:11px 10px 11px 9px;border:none;outline:none;background:transparent;font-size:16px;color:var(--ink)}.search-box input::placeholder{color:#a0aaa2}.search-box .glass{font-size:23px;padding:0 4px 0 9px;color:var(--green)}.search-box button,.primary{background:var(--green);color:white;border:none;border-radius:11px;font-weight:700;padding:11px 16px;font-size:13px}.types{display:flex;gap:7px;margin:13px 0 23px}.type-btn,.chip{border:1px solid #dce3dd;border-radius:50px;background:transparent;padding:8px 14px;font-size:12px;color:#596b60;font-weight:650}.type-btn.active{background:#e6eee7;border-color:#c7ddce;color:#286b55}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:22px 0 12px}.sectionhead h3{margin:0;font-family:Georgia,serif;font-size:21px;letter-spacing:-.35px}.sectionhead small{font-size:11px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#fffefa;color:#43584a;border:1px solid #e9e9e2;border-radius:12px;font-size:12px}.chip:active{background:#e7f0e9}.feature-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:19px}.feature{background:#fffefa;padding:16px 14px;border-radius:18px;border:1px solid var(--border);min-height:121px;text-align:left;color:var(--ink)}.feature b{display:block;font-size:13px;margin:10px 0 3px}.feature span{font-size:10px;color:var(--muted);line-height:1.4}.feature .emoji{font-size:26px}.sync{border-radius:13px;padding:10px 13px;margin-top:18px;display:flex;gap:8px;align-items:center;color:#59725f;background:#e8ede4;font-size:11px;line-height:1.45}.dot{width:7px;height:7px;flex:none;border-radius:50%;background:#75aa87}.dot.bad{background:#cf7f65}.top-title{margin:4px 0 7px;font-size:27px;font-family:Georgia,serif}.subtitle{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 18px}.toolbar{display:flex;gap:9px;margin-bottom:16px;align-items:center}.tiny-back{border:none;background:#e8eee6;color:#386b55;border-radius:10px;padding:9px 12px;font-size:13px}.results{display:flex;flex-direction:column;gap:10px}.book{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:13px;display:flex;gap:12px;box-shadow:0 2px 7px #27362b06}.cover{min-width:74px;width:74px;height:103px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset -5px 0 #00000012;color:white;text-align:center;padding:6px;font-family:Georgia,serif;background:linear-gradient(148deg,#315d53,#618b73)}.cover span{font-size:23px;margin-bottom:7px}.cover small{font-size:8px;line-height:1.2;max-width:60px;opacity:.85}.cover.c1{background:linear-gradient(148deg,#91634f,#c59773)}.cover.c2{background:linear-gradient(148deg,#545e7c,#8c9aae)}.cover.c3{background:linear-gradient(148deg,#9c7361,#d2a88c)}.cover.c4{background:linear-gradient(148deg,#58675c,#9aa18b)}.book-details{flex:1;min-width:0}.book h4{font-size:14px;line-height:1.4;margin:2px 0 5px;font-weight:750}.book .author{font-size:11px;color:var(--muted);line-height:1.5}.book-tags{margin-top:7px;color:#407258;font-size:10px;font-weight:700}.book-actions{display:flex;align-items:center;gap:8px;margin-top:11px}.small-primary{background:#e8f0e9;color:#286b55;border:none;border-radius:9px;padding:8px 11px;font-weight:700;font-size:11px}.star{font-size:20px;border:none;background:transparent;color:#bcc6bd;padding:2px 5px}.star.on{color:#d49b40}.nav{height:calc(71px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,530px);border-top:1px solid #e4e9df;background:#fffefaee;display:flex;justify-content:space-around;backdrop-filter:blur(14px);z-index:8}.nav button{width:25%;background:transparent;border:0;color:#98a29c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:10px;font-weight:650}.nav .ni{font-size:22px}.nav button.active{color:#286b55}.empty{text-align:center;padding:48px 16px;background:#fffefa;border:1px dashed #d6ded5;border-radius:18px}.empty .emoji{font-size:45px}.empty h4{margin:10px 0}.empty p{font-size:12px;color:var(--muted);line-height:1.6}.wait{padding:40px;text-align:center;color:var(--muted);font-size:12px}.spinner{width:27px;height:27px;border:3px solid #d8e4da;border-top-color:#386e53;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 15px}@keyframes spin{to{transform:rotate(360deg)}}.alert{background:#fff3eb;border:1px solid #f1d7c8;border-radius:16px;padding:18px;color:#915647;font-size:12px;line-height:1.6}.alert strong{display:block;color:#6f382e;font-size:14px;margin-bottom:5px}.error-back{margin-top:12px}.section-item{background:white;border:1px solid var(--border);border-radius:15px;padding:14px 15px;display:flex;align-items:center;gap:13px;cursor:pointer}.section-item .ico{font-size:23px}.section-item .lbl{flex:1;font-size:13px;font-weight:700}.section-item .arrow{color:#9ea8a0}.loadmore{width:100%;background:#e9eee7;border:0;border-radius:12px;padding:13px;color:#286b55;margin-top:15px;font-weight:700}.overlay{position:fixed;inset:0;z-index:20;background:#15231bb0;display:flex;align-items:flex-end;justify-content:center}.sheet{border-radius:27px 27px 0 0;max-height:90dvh;overflow-y:auto;max-width:530px;width:100%;background:var(--paper);padding:10px 21px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -10px 50px #20362926}.grab{width:42px;height:5px;border-radius:8px;background:#d6dcd3;margin:2px auto 18px}.sheet-heading{display:flex;gap:15px;align-items:center;margin-bottom:16px}.sheet-heading .cover{width:85px;min-width:85px;height:112px}.sheet h2{font-size:23px;line-height:1.16;font-family:Georgia,serif;margin:0 0 7px}.sheet .desc{font-size:13px;line-height:1.65;color:#637166;white-space:pre-wrap}.sheet .subheading{font-family:Georgia,serif;font-size:18px;margin-top:20px;margin-bottom:10px}.fmt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fmt{border-radius:13px;background:#e2eee5;border:1px solid #d2e0d4;padding:13px;color:#27674f;font-size:12px;font-weight:800}.sheet .close{position:absolute;right:18px;top:12px;border:0;background:#e9eee7;border-radius:50%;height:32px;width:32px;font-size:19px}.overlay{animation:appear .18s}@keyframes appear{from{opacity:.3}to{opacity:1}}.sheet-wrap{position:relative}.progressbar{height:7px;border-radius:10px;background:#d9e4da;overflow:hidden;margin-top:10px}.progressbar div{height:100%;background:#36765b;transition:width .3s}.reader{white-space:pre-wrap;line-height:1.83;font-family:Georgia,serif;color:#242b25;font-size:17px;max-height:62dvh;overflow-y:auto;padding:8px 0}.reader-bar{display:flex;gap:10px;align-items:center;justify-content:space-between}.reader-bar button{border:0;background:#e4ebe3;color:#315a46;border-radius:7px;padding:7px 11px}.bookfile{display:flex;gap:12px;align-items:center;border:1px solid var(--border);background:#fffefa;border-radius:15px;padding:13px;margin-bottom:10px}.bookfile .fileinfo{min-width:0;flex:1}.bookfile strong{display:block;font-size:12px;line-height:1.35}.bookfile small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.fileactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.fileactions button{border:0;background:#e9f0e8;border-radius:8px;color:#315f4e;font-weight:700;font-size:10px;padding:7px 9px}.settings-label{font-size:12px;color:#657468;margin:18px 0 8px}.select{width:100%;border:1px solid #d8e2d8;background:white;border-radius:12px;padding:13px;color:#304f3d}.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:480px;width:calc(100% - 42px);background:#254c3d;color:white;padding:12px 14px;border-radius:12px;box-shadow:0 10px 25px #12251a2e;font-size:12px;z-index:30;line-height:1.5}.toast.bad{background:#a75245}.hidden{display:none!important}@media(min-width:570px){#app{border-left:1px solid #e8e6df;border-right:1px solid #e8e6df;box-shadow:0 0 30px #0011}.hero{min-height:200px}}
</style></head><body>
<div id="app"><header class="top"><div class="brand"><div class="brand-icon">📖</div><div><h1>Книжная полка</h1><small>Ульяновск · Мобильная библиотека</small></div></div><button class="circle" id="settingsBtn" aria-label="Настройки">⚙</button></header><main id="screen"></main></div>
<nav class="nav" aria-label="Разделы"><button data-tab="home" class="active"><span class="ni">⌂</span>Главная</button><button data-tab="catalog"><span class="ni">▦</span>Каталог</button><button data-tab="favorites"><span class="ni">♡</span>Избранное</button><button data-tab="downloads"><span class="ni">⇩</span>Мои книги</button></nav><div id="modal"></div><div id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=x=>encodeURIComponent(x||'');
const read=(k,def)=>{try{let v=JSON.parse(localStorage.getItem('bs2_'+k));return v??def}catch(e){return def}};
const save=(k,obj)=>{try{localStorage.setItem('bs2_'+k,JSON.stringify(obj))}catch(e){}};
const state={view:'home',searchType:'books',items:[],next:null,query:'',favorites:read('favorites',[]),downloads:read('downloads',[]),history:read('history',[]),busy:false,modal:false};
const native=typeof window.Books!=='undefined';
let rid=0;const pending={};
window.__bookshelfReply=(id,response)=>{let p=pending[id];if(!p)return;delete pending[id];response.ok?p.resolve(response.data):p.reject(new Error(String(response.data||'Ошибка источника')))};
window.__bookshelfProgress=(id,percent)=>{let bar=$('download-progress');if(bar)bar.style.width=percent+'%';let label=$('download-percent');if(label)label.textContent=percent+'%'};
function callNative(method,...args){return new Promise((resolve,reject)=>{const id='b'+(++rid);pending[id]={resolve,reject};try{window.Books[method](...args,id)}catch(e){delete pending[id];reject(e)}})}
async function backend(path,opt={}){let r=await fetch(path,opt);let d=await r.json();if(!r.ok)throw new Error(d.error||'Сервер недоступен');return d}
const api={
  selfTest:()=>native?callNative('selfTest'):Promise.reject(new Error('Только для Android')),
  diagnose:()=>native?callNative('diagnose'):Promise.reject(new Error('Проверка работает в Android-версии')),
  search:(q,t)=>native?callNative('search',q,t):backend('/api/search?q='+qs(q)+'&type='+qs(t)),
  feed:href=>native?callNative('feed',href):backend('/api/feed?path='+qs(href)),
  download:(b,f)=>native?callNative('download',f.url,b.title,b.author,f.format):backend('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:f.url,title:b.title,author:b.author,format:f.format})}),
  preview:d=>native?callNative('preview',d.uri,d.format):backend('/api/reader?file='+qs(d.name)),
  open:d=>{if(native){window.Books.openFile(d.uri,d.format)}else{window.location.href='/api/file?file='+qs(d.name)}},
  pick:()=>native?window.Books.pickFile():note('Импорт файлов доступен в Android-приложении')
};
function key(b){return b.id||b.site||`${b.title}|${b.author}`}
function isFav(b){return state.favorites.some(x=>key(x)===key(b))}
function toggleFav(b){if(isFav(b)){state.favorites=state.favorites.filter(x=>key(x)!==key(b));note('Удалено из избранного')}else{state.favorites.unshift(b);note('Добавлено в избранное')}save('favorites',state.favorites)}
function note(message,bad=false){$('toast').innerHTML=`<div class="toast ${bad?'bad':''}">${esc(message)}</div>`;clearTimeout(note._id);note._id=setTimeout(()=>$('toast').innerHTML='',3600)}
function active(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.view))}
function cover(b){const n=[...' '+(b.title||'К')].reduce((x,c)=>x+c.charCodeAt(0),0)%5;const title=esc((b.title||'Книга').slice(0,30));return `<div class="cover c${n}"><span>❧</span><small>${title}</small></div>`}
function nav(view){hide();state.view=view;active();window.scrollTo(0,0);if(view==='home')home();if(view==='catalog')loadFeed('/opds','Каталог');if(view==='favorites')renderFav();if(view==='downloads')renderDownloads()}
function home(){state.view='home';active();$('screen').innerHTML=`<section class="hero"><div class="eyebrow">Любимые истории рядом</div><h2>Ваша библиотека всегда с вами</h2><p>Найдите книгу, выберите формат и сохраните её в телефон.</p></section><form class="search-box" id="searchForm"><span class="glass">⌕</span><input id="queryInput" autocomplete="off" enterkeyhint="search" placeholder="Название книги или автор" required/><button>Найти</button></form><div class="types"><button class="type-btn ${state.searchType==='books'?'active':''}" data-type="books">Книги</button><button class="type-btn ${state.searchType==='authors'?'active':''}" data-type="authors">Авторы</button><button class="type-btn ${state.searchType==='sequences'?'active':''}" data-type="sequences">Серии</button></div><div class="sectionhead"><h3>Что почитать?</h3><small>Популярные темы</small></div><div class="chips">${['История России','Психология','Маркетинг','Детектив','Экономика','Фантастика','Саморазвитие','Классика'].map(x=>`<button class="chip" data-quick="${esc(x)}">${esc(x)}</button>`).join('')}</div>${state.history.length?`<div class="sectionhead"><h3>Недавние запросы</h3><small id="clearHistory">Очистить</small></div><div class="chips">${state.history.slice(0,5).map(x=>`<button class="chip" data-quick="${esc(x)}">↺ ${esc(x)}</button>`).join('')}</div>`:''}<div class="feature-row"><button class="feature" id="latest"><span class="emoji">✦</span><b>Новые книги</b><span>Свежие поступления в каталог</span></button><button class="feature" id="genres"><span class="emoji">▤</span><b>Разделы каталога</b><span>Выбирайте литературу по темам</span></button></div><div class="sync"><span class="dot ${location.protocol==='file:'&&!native?'bad':''}"></span><span>${native?'Приложение обращается к каталогу напрямую. Скачанные книги сохраняются в папке «Загрузки / Книжная полка».':location.protocol==='file:'?'Для поиска откройте приложение через локальный сервер или установите Android-версию.':'Мобильный веб-режим: для поиска должен быть включён сервер на компьютере в той же сети Wi-Fi.'}</span></div>`;
$('searchForm').onsubmit=e=>{e.preventDefault();runSearch($('queryInput').value)};
$('latest').onclick=()=>loadFeed('/opds/new','Новые поступления');$('genres').onclick=()=>loadFeed('/opds/genres','Жанры');
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.searchType=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b))});
document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>runSearch(b.dataset.quick));if($('clearHistory'))$('clearHistory').onclick=()=>{state.history=[];save('history',[]);home()};}
function wait(text){$('screen').innerHTML=`<div class="wait"><div class="spinner"></div>${esc(text)}</div>`}
function error(message,retry){$('screen').innerHTML=`<div class="alert"><strong>Не удалось получить данные</strong><p>${esc(message)}</p><div style="margin-top:10px;color:#815b4e">Иногда сайт открывает списки, но не отдаёт книги. Это не означает, что книга удалена с вашего телефона.</div><button class="primary error-back" id="again">Повторить</button> <button class="tiny-back" id="diagnoseError">Диагностика</button> <button class="tiny-back" id="localError">Мои файлы</button></div>`;$('again').onclick=retry;$('diagnoseError').onclick=settings;$('localError').onclick=()=>nav('downloads')}
async function runSearch(q){q=q.trim();if(q.length<2){note('Введите минимум два символа',true);return}state.query=q;state.history=[q,...state.history.filter(x=>x!==q)].slice(0,12);save('history',state.history);state.view='catalog';active();wait('Ищем книги по запросу «'+q+'»…');try{let data=await api.search(q,state.searchType);renderCatalog(data,'Результаты поиска','Найдено по запросу: '+q)}catch(e){error(e.message,()=>runSearch(q))}}
async function loadFeed(href,label){state.view='catalog';active();wait('Открываем каталог…');try{let d=await api.feed(href);renderCatalog(d,label,d.title||'Раздел библиотеки')}catch(e){error(e.message,()=>loadFeed(href,label))}}
function renderCatalog(data,label,subtitle){state.items=Array.isArray(data.items)?data.items:[];state.next=data.next||null;let books=state.items.filter(b=>b.kind==='book');let sections=state.items.filter(b=>b.kind==='section'&&b.navigation);let unavailable=state.items.filter(b=>b.kind!=='book'&&!(b.kind==='section'&&b.navigation));$('screen').innerHTML=`<div class="toolbar"><button class="tiny-back" id="goHome">‹ Главная</button></div><h2 class="top-title">${esc(label)}</h2><p class="subtitle">${esc(subtitle||'Каталог')} · ${state.items.length} позиций на странице</p><div class="results" id="results"></div>${state.next?'<button class="loadmore" id="nextPage">Показать ещё →</button>':''}`;
$('goHome').onclick=()=>nav('home');$('results').innerHTML=sections.map(b=>`<button class="section-item" data-open-section="${qs(b.navigation)}"><span class="ico">📂</span><span class="lbl">${esc(b.title)}<small style="display:block;opacity:.72;margin-top:3px">${esc(b.summary||'Открыть список книг')}</small></span><span class="arrow">›</span></button>`).join('')+books.map(bookCard).join('')+unavailable.map(b=>`<div class="section-item" style="opacity:.7"><span class="ico">ⓘ</span><span class="lbl">${esc(b.title)}<small style="display:block;margin-top:4px">Источник не передал адрес списка книг или загрузки. Это не отдельная книга.</small></span></div>`).join('')||'<div class="empty"><div class="emoji">🔎</div><h4>Ничего не нашлось</h4><p>Попробуйте другое название или поиск по автору.</p></div>';
wireBooks();document.querySelectorAll('[data-open-section]').forEach(btn=>btn.onclick=()=>loadFeed(decodeURIComponent(btn.dataset.openSection),btn.innerText.trim()));
if($('nextPage'))$('nextPage').onclick=()=>loadFeed(state.next,label)}
function bookCard(b){let i=state.items.findIndex(x=>x===b);let fm=b.formats||[];return `<article class="book">${cover(b)}<div class="book-details"><h4>${esc(b.title||'Без названия')}</h4><div class="author">${esc(b.author||'Автор не указан')}</div><div class="book-tags">${fm.length?fm.map(f=>esc(f.format)).join(' · '):(b.navigation?'Уточнить форматы':'Сведения о книге')}</div><div class="book-actions"><button class="small-primary" data-open="${i}">Подробнее ›</button><button class="star ${isFav(b)?'on':''}" aria-label="Избранное" data-fav="${i}">${isFav(b)?'★':'☆'}</button></div></div></article>`}
function wireBooks(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>details(state.items[+b.dataset.open]));document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{toggleFav(state.items[+b.dataset.fav]);b.classList.toggle('on');b.textContent=isFav(state.items[+b.dataset.fav])?'★':'☆'})}
function details(b){state.modal=true;let fm=Array.isArray(b.formats)?b.formats:[];$('modal').innerHTML=`<div class="overlay" id="overlay"><div class="sheet"><div class="grab"></div><div class="sheet-wrap"><button class="close" id="close">×</button><div class="sheet-heading">${cover(b)}<div><div class="eyebrow">Карточка книги</div><h2>${esc(b.title)}</h2><p class="subtitle" style="margin:0">${esc(b.author||'Автор не указан')}</p></div></div><div class="subheading">Скачать на телефон</div><div class="fmt-grid">${fm.length?fm.map((f,i)=>`<button class="fmt" data-format="${i}">⇩ ${esc(f.format)}</button>`).join(''):'<span class="subtitle">Источник пока не сообщил доступные форматы для этой записи.</span>'}</div>${!fm.length&&b.navigation?'<button class="loadmore" id="moreFormats">Запросить карточку книги ↗</button>':''}<div id="dl-status" class="subtitle" style="margin-top:11px">${fm.length?'Выберите формат. Файл сохранится в загрузках телефона.':'Попробуйте запросить подробную карточку книги.'}</div><div class="progressbar hidden" id="progress-wrap"><div id="download-progress" style="width:0%"></div></div><div style="margin-top:8px;font-size:11px;color:var(--muted)" id="download-percent"></div>${b.summary?`<div class="subheading">О книге</div><div class="desc">${esc(b.summary)}</div>`:''}<button class="loadmore" id="modalFav">${isFav(b)?'★ Убрать из избранного':'☆ Добавить в избранное'}</button><p class="subtitle" style="margin-top:15px">Скачивайте только материалы, распространяемые с разрешения правообладателей.</p></div></div></div>`;
$('overlay').onclick=e=>{if(e.target===$('overlay'))hide()};$('close').onclick=hide;
$('modalFav').onclick=()=>{toggleFav(b);details(b)};
document.querySelectorAll('[data-format]').forEach(btn=>btn.onclick=()=>download(b,fm[+btn.dataset.format]));
if($('moreFormats'))$('moreFormats').onclick=async()=>{let button=$('moreFormats');button.disabled=true;button.textContent='Загружаем подробности…';try{
 const feed=await api.feed(b.navigation);const items=feed.items||[];
 const got=items.find(x=>x.formats&&x.formats.length&&((b.id&&x.id===b.id)||x.title===b.title));
 if(got){const updated={...b,...got,summary:got.summary||b.summary,formats:got.formats};details(updated)}
 else {button.disabled=false;button.textContent='Повторить запрос';$('dl-status').textContent='В подробной карточке сервер не предоставил файлов для скачивания.'}
}catch(e){button.disabled=false;button.textContent='Повторить запрос';$('dl-status').textContent='Ошибка подробной карточки: '+e.message;}
};}
function hide(){state.modal=false;$('modal').innerHTML=''}
async function download(book,format){if(state.busy){note('Загрузка уже выполняется');return}state.busy=true;document.querySelectorAll('[data-format]').forEach(el=>el.disabled=true);$('dl-status').textContent='Загружаем книгу…';$('progress-wrap').classList.remove('hidden');$('download-progress').style.width='4%';try{let item=await api.download(book,format);const obj={name:item.name,uri:item.uri||'',format:format.format,title:book.title,author:book.author,size:item.size||0,added:new Date().toISOString()};state.downloads=[obj,...state.downloads.filter(x=>x.name!==obj.name)].slice(0,200);save('downloads',state.downloads);if(!native){let a=document.createElement('a');a.href='/api/file?file='+qs(item.name);a.download=item.name;document.body.appendChild(a);a.click();a.remove()}
$('dl-status').textContent='Готово! Книга сохранена.';note('✓ Сохранено: '+item.name);setTimeout(()=>{hide();nav('downloads')},600)}catch(e){if($('dl-status'))$('dl-status').textContent='Не удалось скачать: '+e.message;note(e.message,true);document.querySelectorAll('[data-format]').forEach(el=>el.disabled=false)}finally{state.busy=false}}
function renderFav(){state.items=[...state.favorites];$('screen').innerHTML=`<h2 class="top-title">♡ Избранное</h2><p class="subtitle">Сохранённые книги доступны здесь, даже когда каталог не отвечает.</p><div class="results" id="results">${state.items.length?state.items.map(bookCard).join(''):`<div class="empty"><div class="emoji">♡</div><h4>Пока нет избранных книг</h4><p>Ищите литературу и нажимайте на звёздочку возле нужной книги.</p><button class="primary" id="findFav">Искать книги</button></div>`}</div>`;if($('findFav'))$('findFav').onclick=()=>nav('home');wireBooks()}
function renderDownloads(){let ds=state.downloads;
$('screen').innerHTML=`<h2 class="top-title">⇩ Мои книги</h2><p class="subtitle">Книги в папке «Загрузки / Книжная полка». Доступны даже без интернета.</p>${native?'<button class="primary" id="pickLocal" style="margin-bottom:18px;width:100%;padding:15px">+ Добавить книгу из памяти телефона</button>':''}${ds.length?ds.map((b,i)=>`<div class="bookfile"><span style="font-size:27px">📗</span><div class="fileinfo"><strong>${esc(b.title||b.name)}</strong><small>${esc(b.author||'')} · ${esc(b.format)} ${b.size?'· '+Math.round(b.size/1024)+' КБ':''}</small><div class="fileactions">${['FB2','EPUB','TXT','HTML'].includes(b.format)?`<button data-read="${i}">Читать здесь</button>`:''}<button data-openfile="${i}">Открыть файл</button></div></div></div>`).join(''):`<div class="empty"><div class="emoji">📚</div><h4>Полка пока пуста</h4><p>Добавьте свой файл или скачайте доступную книгу из каталога.</p><button class="primary" id="findDownload">Найти книгу</button></div>`}`;
if($('pickLocal'))$('pickLocal').onclick=()=>api.pick();
if($('findDownload'))$('findDownload').onclick=()=>nav('home');
document.querySelectorAll('[data-openfile]').forEach(el=>el.onclick=()=>api.open(ds[+el.dataset.openfile]));
document.querySelectorAll('[data-read]').forEach(el=>el.onclick=()=>reader(ds[+el.dataset.read]));}
window.__bookshelfImported=file=>{const b={name:file.name,uri:file.uri,format:file.format,title:file.title,author:'С телефона',size:file.size||0,added:new Date().toISOString()};state.downloads=[b,...state.downloads.filter(x=>x.name!==b.name)].slice(0,200);save('downloads',state.downloads);nav('downloads');note('✓ Файл добавлен: '+file.name)};
async function reader(d){state.modal=true;$('modal').innerHTML=`<div class="overlay" id="overlay"><div class="sheet" style="max-height:97dvh"><div class="grab"></div><div class="reader-bar"><strong style="font-size:13px;max-width:70%">${esc(d.title)}</strong><div><button id="smaller">A−</button> <button id="larger">A+</button> <button id="closeRead">×</button></div></div><div class="reader" id="reader">Загружаем текст…</div></div></div>`;$('closeRead').onclick=hide;let size=17;$('smaller').onclick=()=>$('reader').style.fontSize=(size=Math.max(13,size-2))+'px';$('larger').onclick=()=>$('reader').style.fontSize=(size=Math.min(29,size+2))+'px';try{let r=await api.preview(d);if($('reader'))$('reader').textContent=r.text||'Не удалось извлечь текст'}catch(e){if($('reader'))$('reader').textContent='Не удалось открыть книгу: '+e.message}}
function settings(){state.modal=true;let current=native?window.Books.getHost():'Веб-режим';
$('modal').innerHTML=`<div class="overlay" id="overlay"><div class="sheet"><div class="grab"></div><div class="sheet-wrap"><button class="close" id="close">×</button><h2>Подключение к каталогу</h2><p class="subtitle">Проверка сети и ответа OPDS</p><div class="settings-label">Адрес источника</div><select id="host" class="select" ${native?'':'disabled'}><option value="https://flibusta.is">https://flibusta.is</option><option value="https://http.flibusta.is">https://http.flibusta.is</option><option value="https://flub.flibusta.is">https://flub.flibusta.is</option><option value="http://http.flibusta.is">http://http.flibusta.is (HTTP)</option></select><button class="primary" id="diagnoseBtn" style="width:100%;margin:14px 0 7px">Проверить OPDS-подключение</button><button class="loadmore" id="selfTestBtn" style="margin:0 0 14px">Самопроверка приложения без интернета</button><div id="diagnoseStatus" style="font-size:12px;line-height:1.55;color:#5d7163;background:#e8efe8;padding:12px;border-radius:12px">Проверка сообщит, отвечает ли каталог. Это не гарантия загрузки конкретной книги.</div><p class="subtitle" style="margin-top:14px">Если сервер отдаёт каталог, но возвращает HTTP 404/503/504 при открытии книги, проблема может быть на стороне источника. Мы не обходим блокировки и не подменяем скачанный файл страницей ошибки.</p><p class="subtitle">Ваши книги можно добавить вручную в разделе «Мои книги» — без соединения с сайтом.</p></div></div></div>`;
$('close').onclick=hide;const sel=$('host');if(native){sel.value=current;sel.onchange=()=>{window.Books.setHost(sel.value);$('diagnoseStatus').textContent='Источник изменён. Нажмите «Проверить OPDS-подключение».'}};
$('selfTestBtn').onclick=async()=>{let b=$('selfTestBtn');b.disabled=true;try{const d=await api.selfTest();$('diagnoseStatus').textContent='✓ '+d.status}catch(e){$('diagnoseStatus').textContent='✕ Ошибка приложения: '+e.message}finally{b.disabled=false}};
$('diagnoseBtn').onclick=async()=>{const btn=$('diagnoseBtn');btn.disabled=true;$('diagnoseStatus').textContent='Проверяем подключение…';try{const d=await api.diagnose();$('diagnoseStatus').textContent='✓ '+d.status+' Адрес: '+d.host+'. Получено записей: '+d.entries+'.';}catch(e){$('diagnoseStatus').textContent='✕ '+e.message}finally{btn.disabled=false}};
}
window.mobileBack=()=>{if(state.modal)hide();else if(state.view!=='home')nav('home')};
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>nav(btn.dataset.tab));$('settingsBtn').onclick=settings;
home();
</script></body></html>
